buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
       classpath 'com.android.tools.build:gradle:8.3.0'
    }
}

plugins {
    id 'idea'
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

idea.module {
    excludeDirs += file('out')
    resourceDirs += file('template')
    resourceDirs += file('scripts')
}

ext {
    min_sdk = 23
    target_sdk = 33
    minSdkVersion = 23
    targetSdkVersion = 34
    buildToolsVersion = '30.0.3'
    ndkVersion = '21.4.7075529'
    outDir = file("$rootDir/out")
    outGPhotosDir = file("$rootDir/GPhotos/out")
}

tasks.register('clean', Delete) {
    delete outGPhotosDir, "$rootDir/PixelLauncher/out", "$rootDir/CallScreen/out", "$rootDir/InstallAPK/out", "$rootDir/Systemazer/out", "$rootDir/GPhotos/out"
}
tasks.register('cleanOut', Delete) {
    delete outDir
}
tasks.register('buildAll', Sync) {
    group = "build"
    description = "Collects all submodule ZIPs into the root out directory"

    subprojects.each { sub ->
        def zipTask = sub.tasks.findByName('buildZip')
        if (zipTask) {
            dependsOn zipTask
            from(zipTask.destinationDirectory) {
                include "*.zip"
            }
        }
    }
    
    into outDir
}